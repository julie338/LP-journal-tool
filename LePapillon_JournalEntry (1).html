<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Papillon — Monthly Journal Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FAF7F2;
    --warm-white: #FFFDFB;
    --ink: #1A1612;
    --ink-light: #4A4440;
    --ink-faint: #8A8480;
    --gold: #B8965A;
    --gold-light: #D4AE78;
    --gold-pale: #F0E4CC;
    --border: #E8E0D4;
    --border-strong: #C8BCB0;
    --red: #B84040;
    --green: #2D6B4A;
    --section-bg: #F5F0E8;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  .header {
    background: var(--ink);
    color: var(--warm-white);
    padding: 2.5rem 2rem 2rem;
    border-bottom: 3px solid var(--gold);
  }
  .header-inner { max-width: 860px; margin: 0 auto; }
  .header-eyebrow {
    font-size: 10px; font-weight: 500; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--gold-light); margin-bottom: 0.5rem;
  }
  .header h1 {
    font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 400;
    letter-spacing: 0.02em; color: var(--warm-white); line-height: 1.2;
  }
  .header-sub { font-size: 13px; color: #A09890; margin-top: 0.4rem; }

  .main { max-width: 860px; margin: 0 auto; padding: 2rem; }

  .month-bar {
    display: flex; gap: 12px; align-items: flex-end;
    background: var(--warm-white); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem;
  }
  .month-bar .field { display: flex; flex-direction: column; gap: 5px; }
  .month-bar .field:first-child { flex: 1; }

  .card {
    background: var(--warm-white); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 1.25rem; overflow: hidden;
  }
  .card-header {
    background: var(--section-bg); padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
  }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 20px;
    font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .badge-rest { background: #E8EFF5; color: #2A5070; }
  .badge-cat  { background: #EEF5E8; color: #2A5030; }
  .card-header-title {
    font-family: 'Playfair Display', serif; font-size: 14px;
    font-weight: 400; color: var(--ink); flex: 1;
  }
  .card-body { padding: 1.25rem 1.5rem; }

  .sub-section { margin-bottom: 1.25rem; }
  .sub-section:last-child { margin-bottom: 0; }
  .sub-label {
    font-size: 10px; font-weight: 500; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 0.75rem;
    padding-bottom: 0.4rem; border-bottom: 1px solid var(--gold-pale);
  }

  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
  .field { display: flex; flex-direction: column; gap: 4px; }

  label { font-size: 12px; font-weight: 400; color: var(--ink-faint); letter-spacing: 0.02em; }

  input[type="text"], input[type="number"], select {
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 300;
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--cream); color: var(--ink);
    transition: border-color 0.15s, background 0.15s; width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: var(--gold); background: var(--warm-white); }
  input.has-value { background: var(--warm-white); border-color: var(--border-strong); }

  .generate-btn {
    width: 100%; padding: 14px 20px; background: var(--ink); color: var(--warm-white);
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase; border: none;
    border-radius: 8px; cursor: pointer; margin-top: 0.5rem;
    transition: background 0.15s, transform 0.1s; position: relative; overflow: hidden;
  }
  .generate-btn:hover { background: #2A2420; }
  .generate-btn:active { transform: scale(0.995); }
  .generate-btn::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 2px; background: var(--gold);
  }

  #result { display: none; margin-top: 2rem; }

  .result-header {
    display: flex; align-items: baseline;
    justify-content: space-between; margin-bottom: 1rem;
  }
  .result-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 400; color: var(--ink); }
  .result-actions { display: flex; gap: 8px; align-items: center; }

  .balance-tag { font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 20px; }
  .balanced   { background: #DFF0E8; color: var(--green); }
  .unbalanced { background: #F5E0E0; color: var(--red); }

  .action-btn {
    font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 6px 14px;
    border: 1px solid var(--border-strong); border-radius: 6px;
    background: var(--warm-white); color: var(--ink); cursor: pointer; transition: background 0.12s;
  }
  .action-btn:hover { background: var(--section-bg); }

  .je-card { background: var(--warm-white); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  thead tr { background: var(--ink); }
  thead th {
    font-size: 10px; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--gold-light); padding: 10px 14px; text-align: left;
  }
  thead th.num { text-align: right; }

  tbody tr.data-row td { padding: 8px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr.data-row:last-of-type td { border-bottom: none; }
  tbody tr.data-row td.acct { color: var(--ink); font-weight: 300; }
  tbody tr.data-row td.num  { text-align: right; font-family: 'DM Mono', monospace, 'DM Sans'; font-size: 12.5px; color: var(--ink-light); white-space: nowrap; }
  tbody tr.data-row td.num.val { color: var(--ink); font-weight: 400; }
  tbody tr.data-row td.memo { font-size: 11px; color: var(--ink-faint); font-style: italic; }

  tbody tr.total-row td {
    padding: 10px 14px; background: var(--section-bg);
    border-top: 2px solid var(--border-strong); font-weight: 500;
  }
  tbody tr.total-row td.num { text-align: right; font-size: 13px; }

  .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 1rem; }
  .summary-card {
    background: var(--warm-white); border: 1px solid var(--border);
    border-radius: 8px; padding: 1rem 1.25rem;
  }
  .summary-card .s-label { font-size: 11px; color: var(--ink-faint); margin-bottom: 4px; letter-spacing: 0.04em; }
  .summary-card .s-val  { font-size: 20px; font-family: 'Playfair Display', serif; font-weight: 400; color: var(--ink); }
  .summary-card.balanced-card   { border-color: #A8D4BC; }
  .summary-card.unbalanced-card { border-color: #D4A8A8; }

  @media print {
    body { background: white; }
    .header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .card:not(.je-card) { display: none !important; }
    .generate-btn, .result-actions, .month-bar { display: none !important; }
    #result { display: block !important; }
    .je-card { border: none; }
    thead tr { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  @media (max-width: 600px) {
    .field-grid { grid-template-columns: 1fr; }
    .summary-grid { grid-template-columns: 1fr; }
    .month-bar { flex-direction: column; }
    .main { padding: 1rem; }
    .result-header { flex-direction: column; gap: 0.75rem; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <p class="header-eyebrow">Accounting Tool</p>
    <h1>Le Papillon</h1>
    <p class="header-sub">Monthly journal entry generator — restaurant &amp; catering</p>
  </div>
</div>

<div class="main">

  <div class="month-bar">
    <div class="field">
      <label>Period</label>
      <select id="month">
        <option>January</option><option>February</option><option>March</option>
        <option>April</option><option>May</option><option>June</option>
        <option>July</option><option>August</option><option>September</option>
        <option>October</option><option>November</option><option>December</option>
      </select>
    </div>
    <div class="field">
      <label>Year</label>
      <input type="number" id="year" value="2026" style="width:90px;">
    </div>
  </div>

  <!-- Restaurant -->
  <div class="card">
    <div class="card-header">
      <span class="badge badge-rest">Restaurant</span>
      <span class="card-header-title">QuickSale — Sales report (All / All)</span>
    </div>
    <div class="card-body">
      <div class="field-grid">
        <div class="field">
          <label>Restaurant sales</label>
          <input type="text" id="rest_sales" placeholder="0.00" oninput="fmtInput(this)">
        </div>
        <div class="field">
          <label>Service charges / shipping</label>
          <input type="text" id="rest_svc" placeholder="0.00" oninput="fmtInput(this)">
        </div>
        <div class="field">
          <label>Sales tax — restaurant</label>
          <input type="text" id="rest_tax" placeholder="0.00" oninput="fmtInput(this)">
        </div>
      </div>

      <div class="sub-section" style="margin-top:1.25rem;">
        <p class="sub-label">Gift certificates</p>
        <div class="field-grid">
          <div class="field">
            <label>GC redeemed (Payments / GC type)</label>
            <input type="text" id="gc_redeemed" placeholder="0.00" oninput="fmtInput(this)">
          </div>
          <div class="field">
            <label>GC sold (Sales by Item)</label>
            <input type="text" id="gc_sold" placeholder="0.00" oninput="fmtInput(this)">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Catering -->
  <div class="card">
    <div class="card-header">
      <span class="badge badge-cat">Catering</span>
      <span class="card-header-title">QuickSale — Sales report (All / All)</span>
    </div>
    <div class="card-body">
      <div class="field-grid">
        <div class="field">
          <label>Catering sales (excl. tax &amp; shipping)</label>
          <input type="text" id="cat_sales" placeholder="0.00" oninput="fmtInput(this)">
        </div>
        <div class="field">
          <label>Service charges / shipping</label>
          <input type="text" id="cat_svc" placeholder="0.00" oninput="fmtInput(this)">
        </div>
        <div class="field">
          <label>Sales tax — catering</label>
          <input type="text" id="cat_tax" placeholder="0.00" oninput="fmtInput(this)">
        </div>
      </div>
    </div>
  </div>

  <button class="generate-btn" onclick="generate()">Generate journal entry</button>

  <div id="result">
    <div class="result-header">
      <h2 class="result-title" id="je-title">Journal entry</h2>
      <div class="result-actions">
        <span class="balance-tag" id="balance-tag"></span>
        <button class="action-btn" onclick="copyJE()">Copy text</button>
        <button class="action-btn" onclick="window.print()">Print / PDF</button>
      </div>
    </div>

    <div class="je-card">
      <table>
        <thead>
          <tr>
            <th style="width:40%">Account</th>
            <th class="num" style="width:14%">Debit</th>
            <th class="num" style="width:14%">Credit</th>
            <th style="width:32%">Memo</th>
          </tr>
        </thead>
        <tbody id="je-body"></tbody>
      </table>
    </div>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="s-label">Total debits</div>
        <div class="s-val" id="sum-dr">—</div>
      </div>
      <div class="summary-card">
        <div class="s-label">Total credits</div>
        <div class="s-val" id="sum-cr">—</div>
      </div>
      <div class="summary-card" id="sum-diff-card">
        <div class="s-label">Difference</div>
        <div class="s-val" id="sum-diff">—</div>
      </div>
    </div>
  </div>

</div>

<script>
function fmtInput(el) {
  el.value = el.value.replace(/[^0-9.]/g, '');
  el.classList.toggle('has-value', el.value !== '' && parseFloat(el.value) > 0);
}

function p(id) {
  return parseFloat(document.getElementById(id).value.replace(/,/g,'')) || 0;
}

function money(n) {
  if (!n) return '';
  return '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function addRow(tbody, account, debit, credit, memo) {
  const tr = document.createElement('tr');
  tr.className = 'data-row';
  const drCell = debit  ? `<td class="num val">${money(debit)}</td>`  : `<td class="num"></td>`;
  const crCell = credit ? `<td class="num val">${money(credit)}</td>` : `<td class="num"></td>`;
  tr.innerHTML = `<td class="acct">${account}</td>${drCell}${crCell}<td class="memo">${memo}</td>`;
  tbody.appendChild(tr);
}

function generate() {
  const month = document.getElementById('month').value;
  const year  = document.getElementById('year').value;

  const restSales  = p('rest_sales');
  const restSvc    = p('rest_svc');
  const restTax    = p('rest_tax');
  const gcRedeemed = p('gc_redeemed');
  const gcSold     = p('gc_sold');
  const catSales   = p('cat_sales');
  const catSvc     = p('cat_svc');
  const catTax     = p('cat_tax');

  const tbody = document.getElementById('je-body');
  tbody.innerHTML = '';

  let totalD = 0, totalC = 0;

  function dr(acct, amt, memo) {
    if (!amt) return;
    totalD += amt;
    addRow(tbody, acct, amt, 0, memo);
  }
  function cr(acct, amt, memo) {
    if (!amt) return;
    totalC += amt;
    addRow(tbody, acct, 0, amt, memo);
  }

  // 1. Catering reclassification
  if (catSales) {
    dr('Restaurant Income', catSales, 'to record catering revenue');
    cr('Catering Income',   catSales, 'to record catering revenue');
  }

  // 2. Sales tax — DR total, CR each separately
  const totalTax = restTax + catTax;
  if (totalTax) {
    dr('Restaurant Income', totalTax, 'all sales tax');
    cr('Sales Tax Payable', catTax,   'catering sales tax');
    cr('Sales Tax Payable', restTax,  'restaurant tax');
  }

  // 3. Service charges — DR total of both, CR total
  const totalSvc = restSvc + catSvc;
  if (totalSvc) {
    dr('Restaurant Income',         totalSvc, 'all service charge');
    cr('Service Charges/Shipping',  totalSvc, 'all service charge');
  }

  // 4. GC purchased (sold)
  if (gcSold) {
    dr('Restaurant Income',        gcSold, 'GC purchased');
    cr('Gift Certificate Payable', gcSold, 'GC purchased');
  }

  // 5. GC redeemed
  if (gcRedeemed) {
    dr('Gift Certificate Payable', gcRedeemed, 'GC redeemed');
    cr('Restaurant Income',        gcRedeemed, 'GC redeemed');
  }

  // Totals row
  const totalTr = document.createElement('tr');
  totalTr.className = 'total-row';
  totalTr.innerHTML = `<td>Total</td><td class="num">${money(totalD)||'$0.00'}</td><td class="num">${money(totalC)||'$0.00'}</td><td></td>`;
  tbody.appendChild(totalTr);

  // Summary cards
  document.getElementById('sum-dr').textContent   = money(totalD) || '$0.00';
  document.getElementById('sum-cr').textContent   = money(totalC) || '$0.00';
  const diff = Math.abs(totalD - totalC);
  document.getElementById('sum-diff').textContent = diff < 0.02 ? '$0.00' : money(diff);

  const balanced = diff < 0.02;
  const balTag = document.getElementById('balance-tag');
  balTag.textContent = balanced ? '✓ Balanced' : '⚠ Out of balance';
  balTag.className = 'balance-tag ' + (balanced ? 'balanced' : 'unbalanced');
  document.getElementById('sum-diff-card').className = 'summary-card ' + (balanced ? 'balanced-card' : 'unbalanced-card');

  document.getElementById('je-title').textContent = month + ' ' + year + ' — Journal Entry';
  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({behavior:'smooth', block:'start'});
}

function copyJE() {
  const title = document.getElementById('je-title').textContent;
  const rows = document.querySelectorAll('#je-body tr');
  let text = title + '\n' + '='.repeat(72) + '\n';
  text += 'Account'.padEnd(34) + 'Debit'.padStart(14) + 'Credit'.padStart(14) + '  Memo\n';
  text += '-'.repeat(72) + '\n';
  rows.forEach(r => {
    if (r.classList.contains('data-row')) {
      const c = r.querySelectorAll('td');
      text += c[0].textContent.padEnd(34)
            + (c[1].textContent||'').padStart(14)
            + (c[2].textContent||'').padStart(14)
            + '  ' + c[3].textContent + '\n';
    } else if (r.classList.contains('total-row')) {
      const c = r.querySelectorAll('td');
      text += '-'.repeat(72) + '\n';
      text += c[0].textContent.padEnd(34)
            + c[1].textContent.padStart(14)
            + c[2].textContent.padStart(14) + '\n';
    }
  });
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelectorAll('.action-btn')[0];
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy text', 2000);
  });
}

// Set current month on load
const now = new Date();
document.getElementById('month').selectedIndex = now.getMonth();
document.getElementById('year').value = now.getFullYear();
</script>
</body>
</html>
